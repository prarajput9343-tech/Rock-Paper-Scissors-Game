<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK PAPER SCISSOR GAME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <h1 class="app-title">Rock Paper Scissor</h1>
  <div class="container">
   
     <div class="weapon-box">
         <h3>Play your move</h3>
        <div id="loader1"></div>
        <div id="loader2"></div>
        <div id="loader3"></div>

        <div class="weapons">
            <div class="rock">
                <img src="rockPlayer.png" alt="" />
            </div>
            <div class="paper">
                <img src="paperPlayer.png" alt="" />
            </div>
            <div class="scissor">
                <img src="scissorPlayer.png" alt="" />
            </div>
        </div>
     </div>
     <div class="player-choices">
        <h4>Computer<span> V/S </span>Player</h4>
        <div class="computer-choice">
            <img src="rockComputer.png" alt="" />
        </div>
        <div class="player-choice">
            <img src="rockPlayer.png" alt="" />
        </div>
     </div>
     <div class="result-box">
        <h2>You Won!</h2>
        <button class="play again">&#x27F2;</button>
     </div>
     <div class="score-box">
        <div class="won">
            <h2>Won: <span>0</span></h2>
        </div>
         <div class="lost">
            <h2>Lost: <span>0</span></h2>
        </div>
         <div class="draw">
            <h2>Draw: <span>0</span></h2>
        </div>
     </div>
  </div>
    <script src="script.js"></script>
</body>
</html>
